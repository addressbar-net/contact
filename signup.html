<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, nosnippet">
<title>addressbar.net — Host Authentication</title>
<style>
	:root {
		--font-size--base: 14pt;
		--font-size--title: 16pt;
		
		/* addressbar.net — Classic 1-Bit Macintosh Monochrome Theme */
		--mac-white: #ffffff;
		--mac-black: #000000;
	}

	* {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
		font-family: 'Chicago', 'Geneva', 'Monaco', 'Courier New', monospace;
		color: var(--mac-black);
	}

	body {
		min-height: 100vh;
		padding: 20px;
		background-color: var(--mac-white);
		/* Classic Mac OS Desktop Checkerboard Pattern */
		background-image: radial-gradient(var(--mac-black) 1px, transparent 0);
		background-size: 4px 4px;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
	}

	/* Macintosh Window Container */
	.mac-window {
		background-color: var(--mac-white);
		border: 2px solid var(--mac-black);
		box-shadow: 6px 6px 0px var(--mac-black);
		width: 100%;
		max-width: 460px;
		padding: 4px;
	}

	/* Lined Mac Window Title Bar */
	.window-titlebar {
		background: repeating-linear-gradient(
			0deg,
			var(--mac-black),
			var(--mac-black) 1px,
			var(--mac-white) 1px,
			var(--mac-white) 3px
		);
		padding: 4px;
		border: 1px solid var(--mac-black);
		display: flex;
		align-items: center;
		justify-content: space-between;
	}

	.close-box {
		width: 14px;
		height: 14px;
		background-color: var(--mac-white);
		border: 1px solid var(--mac-black);
		margin-left: 6px;
		cursor: pointer;
	}

	.title-text {
		background-color: var(--mac-white);
		color: var(--mac-black);
		padding: 2px 10px;
		font-weight: bold;
		font-size: var(--font-size--title);
		border: 1px solid var(--mac-black);
		letter-spacing: 1px;
	}

	.window-body {
		padding: 20px;
		border: 1px solid var(--mac-black);
		margin-top: 4px;
		background-color: var(--mac-white);
	}

	/* Form Elements */
	.form-group {
		margin-bottom: 16px;
	}

	.form-group label {
		display: block;
		font-size: var(--font-size--base);
		font-weight: bold;
		margin-bottom: 6px;
	}

	.form-group input {
		width: 100%;
		padding: 8px;
		font-size: var(--font-size--base);
		background-color: var(--mac-white);
		border: 2px solid var(--mac-black);
		outline: none;
		box-shadow: inset 2px 2px 0px #ccc;
	}

	.form-group input:focus {
		outline: 1px dashed var(--mac-black);
	}

	/* Mac Beveled Button */
	.mac-button {
		width: 100%;
		padding: 10px;
		background-color: var(--mac-white);
		border: 2px solid var(--mac-black);
		box-shadow: 2px 2px 0px var(--mac-black);
		font-size: var(--font-size--base);
		font-weight: bold;
		cursor: pointer;
		margin-top: 8px;
	}

	.mac-button:active {
		background-color: var(--mac-black);
		color: var(--mac-white);
		box-shadow: none;
		transform: translate(2px, 2px);
	}

	/* Discrete Help Link */
	.discrete-link {
		display: block;
		text-align: center;
		font-size: 11pt;
		color: var(--mac-black);
		margin-top: 16px;
		text-decoration: underline;
		cursor: pointer;
		background: none;
		border: none;
		width: 100%;
	}

	.discrete-link:hover {
		background-color: var(--mac-black);
		color: var(--mac-white);
	}
</style>
</head>
<body>

  <!-- Main Macintosh Application Window -->
  <div class="mac-window">
    <div class="window-titlebar">
      <div class="close-box" onclick="window.location.href='index.php'" title="Return to Desktop"></div>
      <div class="title-text">addressbar.net</div>
      <div style="width:20px;"></div>
    </div>

    <div class="window-body">
      <div style="margin-bottom: 16px; font-weight: bold; border-bottom: 2px solid var(--mac-black); padding-bottom: 6px;">
        Domain Host Authentication
      </div>

      <!-- Inline Status Banner -->
      <div id="statusBanner" style="display:none; border:2px solid var(--mac-black); padding:10px; margin-bottom:14px; font-size:11pt; font-weight:bold;"></div>

      <!-- Log In Form (Single User Per Domain, Max 3 Attempts Per IP) -->
      <form id="loginForm" onsubmit="handleAuth(event)">
        <div style="font-size:11pt; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
          <span>Domain Host Account: <strong id="domainUserLabel">admin</strong></span>
          <span id="attemptsBadge" style="font-size:10pt; border:1px solid var(--mac-black); padding:2px 6px;">3 of 3 attempts left</span>
        </div>
        <div class="form-group">
          <label for="loginPassword">Host Password:</label>
          <input type="password" id="loginPassword" maxlength="255" required placeholder="Enter password" autofocus>
        </div>
        <button type="submit" id="loginSubmitBtn" class="mac-button">[ Mount Host Account ]</button>
      </form>

      <div style="margin-top: 14px; font-size: 10pt; color: #444; border-top: 1px dashed var(--mac-black); padding-top: 10px; line-height: 1.4;">
        Password management is handled directly via server command-line utilities. To update your password, run <code>update_password</code> on your server.
      </div>

      <a href="index.php" class="discrete-link">
        ⇦ Return to Federated Mail Desktop
      </a>
    </div>
  </div>

  <script>
    function showBanner(msg, isSuccess) {
      const banner = document.getElementById('statusBanner');
      banner.style.display = 'block';
      banner.style.backgroundColor = isSuccess ? '#ffffff' : '#000000';
      banner.style.color = isSuccess ? '#000000' : '#ffffff';
      banner.textContent = (isSuccess ? '✓ ' : '⚠ ') + msg;
    }

    async function handleAuth(event) {
      event.preventDefault();

      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('auth.php?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (data.success) {
          showBanner('Authenticated! Redirecting to Desktop...', true);
          const params = new URLSearchParams(window.location.search);
          const redirectUrl = params.get('redirect') || params.get('returnUrl');
          window.location.href = redirectUrl || 'index.php';
        } else {
          if (typeof data.remaining_attempts === 'number') {
            updateAttemptsUI(data.remaining_attempts, !!data.locked, data.seconds_remaining || 0);
          }
          showBanner('System Notice: ' + data.error, false);
        }
      } catch (err) {
        showBanner('Host Communication Error. Ensure the backend process is running.', false);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('auth.php?action=check');
        const info = await res.json();
        if (info && info.domain_user) {
          document.getElementById('domainUserLabel').textContent = info.domain_user;
        }
        if (info && typeof info.remaining_attempts === 'number') {
          updateAttemptsUI(info.remaining_attempts, !!info.locked, info.seconds_remaining || 0);
          if (info.locked) {
            showBanner(`Maximum of 3 login attempts reached for IP address ${info.ip_address || ''}. Login is locked for 6 hours (${formatLockTimer(info.seconds_remaining || 0)} remaining).`, false);
          }
        }
      } catch (e) {}
    });
      } catch (e) {}
    });
  </script>
</body>
</html>
